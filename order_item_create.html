<!DOCTYPE html>
<html>
<head>
    <title>Add Order Item</title>
</head>
<body>

<h1>Add New Order Item</h1>

<form method="POST">
    {% csrf_token %}

    <label>Order Item ID:</label><br>
    <input type="number" name="order_item_id" required>
    <br><br>

    <label>Order:</label><br>
    <select name="order_id" required>
        <option value="">-- Select Order --</option>

        {% for order in orders %}
            <option value="{{ order.order_id }}">
                Order #{{ order.order_id }} -
                {{ order.customer.first_name }}
                {{ order.customer.last_name }}
            </option>
        {% endfor %}
    </select>
    <br><br>

    <label>Product:</label><br>
    <select name="product_id" required>
        <option value="">-- Select Product --</option>

        {% for product in products %}
            <option value="{{ product.product_id }}">
                {{ product.product_name }} - Rs. {{ product.price }}
            </option>
        {% endfor %}
    </select>
    <br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity" min="1" required>
    <br><br>

    <label>Unit Price:</label><br>
    <input type="number"
           name="unit_price"
           step="0.01"
           min="0"
           required>
    <br><br>

    <button type="submit">Add Order Item</button>

</form>

<br>

<a href="{% url 'order_item_list' %}">
    Back to Order Items
</a>

</body>
</html>
