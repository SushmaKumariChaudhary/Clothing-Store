<!DOCTYPE html>
<html>
<head>
    <title>Delete Product</title>
</head>
<body>

<h1>Delete Product</h1>

<p>
    Are you sure you want to delete
    <strong>{{ product.product_name }}</strong>?
</p>

<p>
    Product ID: {{ product.product_id }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>

    <a href="{% url 'product_list' %}">
        Cancel
    </a>
</form>

</body>
</html>
