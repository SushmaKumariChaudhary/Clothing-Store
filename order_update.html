<!DOCTYPE html>
<html>
<head>
    <title>Update Order</title>
</head>
<body>

<h1>Update Order #{{ order.order_id }}</h1>

<form method="POST">
    {% csrf_token %}

    <label>Customer:</label><br>
    <select name="customer_id" required>
        {% for customer in customers %}
            <option value="{{ customer.customer_id }}"
                {% if customer.customer_id == order.customer_id %}selected{% endif %}>
                {{ customer.first_name }} {{ customer.last_name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Order Date:</label><br>
    <input type="date"
           name="order_date"
           value="{{ order.order_date|date:'Y-m-d' }}"
           required>

    <br><br>

    <label>Order Status:</label><br>
    <select name="order_status" required>
        <option value="PENDING" {% if order.order_status == "PENDING" %}selected{% endif %}>PENDING</option>
        <option value="CONFIRMED" {% if order.order_status == "CONFIRMED" %}selected{% endif %}>CONFIRMED</option>
        <option value="SHIPPED" {% if order.order_status == "SHIPPED" %}selected{% endif %}>SHIPPED</option>
        <option value="DELIVERED" {% if order.order_status == "DELIVERED" %}selected{% endif %}>DELIVERED</option>
        <option value="CANCELLED" {% if order.order_status == "CANCELLED" %}selected{% endif %}>CANCELLED</option>
    </select>

    <br><br>

    <label>Total Amount:</label><br>
    <input type="number"
           name="total_amount"
           value="{{ order.total_amount }}"
           step="0.01"
           required>

    <br><br>

    <button type="submit">Update Order</button>

</form>

<br>

<a href="{% url 'order_list' %}">
    Back to Orders
</a>

</body>
</html>
