<!DOCTYPE html>
<html>
<head>
    <title>Update Order Item</title>
</head>
<body>

<h1>Update Order Item #{{ order_item.order_item_id }}</h1>

<form method="POST">
    {% csrf_token %}

    <label>Order:</label><br>
    <select name="order_id" required>
        {% for order in orders %}
            <option value="{{ order.order_id }}"
                {% if order.order_id == order_item.order_id %}selected{% endif %}>
                Order #{{ order.order_id }} -
                {{ order.customer.first_name }}
                {{ order.customer.last_name }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Product:</label><br>
    <select name="product_id" required>
        {% for product in products %}
            <option value="{{ product.product_id }}"
                {% if product.product_id == order_item.product_id %}selected{% endif %}>
                {{ product.product_name }} - Rs. {{ product.price }}
            </option>
        {% endfor %}
    </select>

    <br><br>

    <label>Quantity:</label><br>
    <input type="number"
           name="quantity"
           value="{{ order_item.quantity }}"
           min="1"
           required>

    <br><br>

    <label>Unit Price:</label><br>
    <input type="number"
           name="unit_price"
           value="{{ order_item.unit_price }}"
           step="0.01"
           min="0"
           required>

    <br><br>

    <button type="submit">Update Order Item</button>

</form>

<br>

<a href="{% url 'order_item_list' %}">
    Back to Order Items
</a>

</body>
</html>
