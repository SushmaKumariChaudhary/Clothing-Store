```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Clothing Store Management System{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand" href="/">
            Clothing Store
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'category_list' %}">
                        Categories
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'product_list' %}">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'order_list' %}">
                        Orders
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'order_item_list' %}">
                        Order Items
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>


<main class="container py-4">

    {% block content %}
    {% endblock %}

</main>


<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="mb-0">
        Clothing Store Management System
    </p>

    <small>
        BCS.IT 4th Semester
    </small>
</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
```
